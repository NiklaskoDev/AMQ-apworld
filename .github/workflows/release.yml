name: release

# Push a tag like v0.8.1 to publish amq.apworld and the userscript as a GitHub release, or run this workflow by hand
# to tag the current commit with its version and release it. The userscript's @updateURL points at the latest
# release, so userscript managers pick the new version up by themselves.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick the tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$(python release.py version)"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Check versions match the tag
        run: python release.py check "$TAG"
      - run: python build.py
      - run: python release.py notes > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG" amq.apworld client/amq_archipelago.user.js
          --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
